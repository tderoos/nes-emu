<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>nes-emu</title>
	<style>
		html, body {
			margin: 0;
			height: 100%;
			background: #101014;
			display: flex;
			align-items: center;
			justify-content: center;
			overflow: hidden;
			font-family: system-ui, sans-serif;
			color: #888;
		}
		canvas {
			image-rendering: pixelated;
			max-width: 100vw;
			max-height: 100vh;
		}
		#hint {
			position: fixed;
			bottom: 1em;
			width: 100%;
			text-align: center;
			pointer-events: none;
		}
	</style>
</head>
<body>
	<canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
	<div id="hint">click or press any key to load a ROM</div>
	<script>
		// The file picker needs a user gesture; hide the hint on the first one
		const hideHint = () => { const h = document.getElementById('hint'); if (h) h.remove(); };
		addEventListener('keydown', hideHint, { once: true });
		addEventListener('mousedown', hideHint, { once: true });
	</script>
	{{{ SCRIPT }}}
</body>
</html>
